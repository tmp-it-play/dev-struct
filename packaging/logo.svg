<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343E53"/>
      <stop offset="1" stop-color="#151A24"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE2EC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE8C8"/>
      <stop offset="1" stop-color="#1FB39C"/>
    </linearGradient>
    <filter id="icon" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#icon)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <g transform="translate(12 20)">
  <!-- 뒤 폴더 -->
  <g fill="#48556F" filter="url(#lift)">
    <rect x="322" y="262" width="170" height="110" rx="36"/>
    <rect x="322" y="306" width="440" height="286" rx="36"/>
  </g>
  <!-- 가운데 폴더 -->
  <g fill="#7E8CA7" filter="url(#lift)">
    <rect x="292" y="327" width="170" height="110" rx="36"/>
    <rect x="292" y="371" width="440" height="286" rx="36"/>
  </g>
  <!-- 앞 폴더 -->
  <g fill="url(#front)" filter="url(#lift)">
    <rect x="262" y="392" width="170" height="110" rx="36"/>
    <rect x="262" y="436" width="440" height="286" rx="36"/>
  </g>

  <!-- 트리 구조 -->
  <path d="M342 520 V640 M342 580 H412 M342 640 H412" fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="342" cy="512" r="26" fill="url(#accent)"/>
  <g fill="#C3CBDA">
    <rect x="440" y="566" width="190" height="28" rx="14"/>
    <rect x="440" y="626" width="140" height="28" rx="14"/>
    <rect x="390" y="498" width="160" height="28" rx="14" fill="#9AA5BA"/>
  </g>
  </g>
</svg>
