name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify tag matches APP_VERSION
        run: |
          version=$(sed -n 's/^const val APP_VERSION = "\(.*\)"/\1/p' shared/src@jvm/Updater.kt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 APP_VERSION $version 이 다릅니다"
            exit 1
          fi

      - name: Test
        run: ./kotlin test
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: 1

      - name: Package app
        run: packaging/package-macos.sh "${GITHUB_REF_NAME#v}"

      - name: Publish draft release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
